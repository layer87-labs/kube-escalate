apiVersion: v2
name: kube-escalate
description: >
  Kubernetes operator for Just-in-Time privilege escalation.
  Grants temporary, time-limited cluster access with automatic expiry,
  a full audit trail via Kubernetes Events, and Prometheus metrics —
  no database, no external dependencies.
type: application
# version and appVersion are PLACEHOLDERS. The release workflow packages the
# chart with `helm package --version $VERSION --app-version $VERSION` using the
# relctl-derived release version, so whatever is committed here never reaches
# the registry. Do not treat these as the published version — check the GitHub
# releases or `helm show chart oci://ghcr.io/layer87-labs/charts/kube-escalate`.
version: 0.0.0
appVersion: "0.0.0"
keywords:
  - kubernetes
  - rbac
  - escalation
  - security
  - jit
  - operator
home: https://github.com/layer87-labs/kube-escalate
sources:
  - https://github.com/layer87-labs/kube-escalate
maintainers:
  - name: layer87-labs
    url: https://github.com/layer87-labs
