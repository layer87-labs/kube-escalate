# Production values for layer87-labs/kube-escalate
# Cluster: layer87-prod — RKE2 v1.34.2, Hetzner, 3 control-plane + 4 workers

replicaCount: 2

image:
  repository: ghcr.io/layer87-labs/kube-escalate
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets:
  - name: ghcr-pull-secret

leaderElection:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # RKE2 API server port; in-cluster kubernetes svc is 443 but the
  # actual apiserver (and therefore the kubeconfig) uses 6443.
  # Allow both so the operator can reach the API server from any code path.
  apiServerPort: 443
  apiServerCIDR: "10.43.0.0/16"   # cluster service CIDR (kubernetes svc at 10.43.0.1)

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Spread across worker nodes; tolerate nothing — no control-plane scheduling.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kube-escalate
          topologyKey: kubernetes.io/hostname

metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false   # flip to true once prometheus-operator is confirmed in this cluster
