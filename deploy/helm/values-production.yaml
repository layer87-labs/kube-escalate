# Production values for layer87-labs/kube-escalate
# Cluster: layer87-prod — RKE2 v1.34.2, Hetzner, 3 control-plane + 4 workers

replicaCount: 2

image:
  repository: ghcr.io/layer87-labs/kube-escalate
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets:
  - name: ghcr-pull-secret

leaderElection:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  # Disabled on this cluster: Cilium 1.18 with kube-proxy-replacement=true
  # intercepts packets before eBPF DNAT when a specific-port egress policy is
  # present, preventing the kubernetes service ClusterIP from being resolved.
  # Standard NetworkPolicy cannot express "allow to kube-apiserver" in a way
  # Cilium's service translation respects. A CiliumNetworkPolicy with
  # toEntities: [kube-apiserver] is the correct fix — tracked as follow-up.
  enabled: false
  apiServerPort: 443
  apiServerCIDR: "0.0.0.0/0"
  additionalEgress: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Spread across worker nodes; tolerate nothing — no control-plane scheduling.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kube-escalate
          topologyKey: kubernetes.io/hostname

metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false   # flip to true once prometheus-operator is confirmed in this cluster
