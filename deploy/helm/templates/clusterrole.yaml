apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-escalate.fullname" . }}
  labels:
    {{- include "kube-escalate.labels" . | nindent 4 }}
rules:
  # Watch and delete kube-escalate-managed ClusterRoleBindings (cluster-wide escalations).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "delete"]

  # Watch and delete kube-escalate-managed RoleBindings (namespace-scoped escalations).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "delete"]

  # Emit Kubernetes Events (EscalationExpired, EscalationRevoked).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leader election lease (required when replicaCount > 1).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
