name: CI

on:
  pull_request:
    branches: [main]
  # Scan main itself, not only pull requests, so new advisories against
  # unchanged code are noticed.
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # ── Generate build infos — all other jobs depend on this ────────────────────
  # relctl posts its help comment on the pull request, so this job needs
  # pull-requests: write. A reusable workflow cannot exceed the permissions of
  # its caller; granting less makes the run fail at startup.
  # It only makes sense for pull requests (it reads the PR number); on push to
  # main and on the schedule it is skipped and the jobs below still run.
  generate-build-infos:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: layer87-labs/relctl-action/.github/workflows/generate-build-infos.yml@main
    with:
      relctl-version: 2.11.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # ── Build – multi-arch compile check ────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [generate-build-infos]
    if: ${{ !cancelled() && (needs.generate-build-infos.result == 'success' || needs.generate-build-infos.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make ci/build

  # ── Audit – vet, lint, vuln scan, race tests ────────────────────────────────
  audit:
    name: Audit
    runs-on: ubuntu-latest
    needs: [generate-build-infos]
    if: ${{ !cancelled() && (needs.generate-build-infos.result == 'success' || needs.generate-build-infos.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run audit
        run: make audit

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage
          go test -race -coverprofile=build/coverage/coverage.out ./...
          go tool cover -html=build/coverage/coverage.out \
            -o build/coverage/coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/coverage.html
          retention-days: 7

  # ── Helm lint ────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    needs: [generate-build-infos]
    if: ${{ !cancelled() && (needs.generate-build-infos.result == 'success' || needs.generate-build-infos.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint deploy/helm/
