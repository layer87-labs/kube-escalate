name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ── Generate build infos — all other jobs depend on this ────────────────────
  generate-build-infos:
    uses: layer87-labs/relctl-action/.github/workflows/generate-build-infos.yml@main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # ── Build – multi-arch compile check ────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [generate-build-infos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make ci/build

  # ── Audit – vet, lint, vuln scan, race tests ────────────────────────────────
  audit:
    name: Audit
    runs-on: ubuntu-latest
    needs: [generate-build-infos]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run audit
        run: make audit

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage
          go test -race -coverprofile=build/coverage/coverage.out ./...
          go tool cover -html=build/coverage/coverage.out \
            -o build/coverage/coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/coverage.html
          retention-days: 7

  # ── Helm lint ────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    needs: [generate-build-infos]
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/
